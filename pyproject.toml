[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdash"
version = "0.0.0"
description = "CMD - Claude Monitoring Dashboard : optimiser l'usage de Claude (l'utilisateur garde la main)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
cmdash = "cmdash.cli:main"

[tool.setuptools.packages.find]
include = ["cmdash*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
